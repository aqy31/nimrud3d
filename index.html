<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>نمرود — القصر الشمالي الغربي | التجربة الافتراضية والأكاديمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================================
       MONOCHROME BLACK & WHITE "LIQUID GLASS" DESIGN SYSTEM
       ===================================================================== */
    :root {
      --lg-bg: rgba(14, 14, 18, 0.44);
      --lg-bg-deep: rgba(10, 10, 14, 0.66);
      --lg-surface-light: rgba(255, 255, 255, 0.10);
      --lg-surface-hover: rgba(255, 255, 255, 0.18);
      --lg-active-bg: #ffffff;
      --lg-active-text: #09090b;
      --lg-border: rgba(255, 255, 255, 0.24);
      --lg-border-bright: rgba(255, 255, 255, 0.55);
      --lg-text: #ffffff;
      --lg-text-muted: rgba(255, 255, 255, 0.72);
      --lg-shadow: 0 12px 36px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -1px 0 rgba(255, 255, 255, 0.08);
      --lg-blur: blur(28px) saturate(190%);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #101216;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--lg-text);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    /* =====================================================================
       LIQUID GLASS LOADING SCREEN (BLACK & WHITE)
       ===================================================================== */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: radial-gradient(circle at 50% 40%, #1f2229 0%, #090a0d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-border);
      box-shadow: var(--lg-shadow);
      border-radius: 28px;
      padding: 36px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .spinner-ring {
      width: 52px;
      height: 52px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.16);
      border-top-color: #ffffff;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .loading-subtitle {
      font-size: 0.86rem;
      color: var(--lg-text-muted);
      margin-bottom: 22px;
      line-height: 1.6;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    #progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 99px;
      transition: width 0.2s ease;
    }

    #loading-status {
      font-size: 0.78rem;
      color: var(--lg-text-muted);
      font-weight: 600;
    }

    /* =====================================================================
       MINIMAL SINGLE TOP LIQUID GLASS CAPSULE
       ===================================================================== */
    .top-capsule-wrap {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      max-width: calc(100vw - 16px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .liquid-capsule {
      pointer-events: auto;
      background: var(--lg-bg);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-border);
      box-shadow: var(--lg-shadow);
      border-radius: 999px;
      padding: 5px 7px;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .liquid-capsule::-webkit-scrollbar {
      display: none;
    }

    .divider-v {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .lg-btn {
      background: transparent;
      color: var(--lg-text);
      border: 1px solid transparent;
      padding: 6px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    .lg-btn:hover {
      background: var(--lg-surface-hover);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .lg-btn.active {
      background: var(--lg-active-bg);
      color: var(--lg-active-text);
      border-color: #ffffff;
      box-shadow: 0 2px 14px rgba(255, 255, 255, 0.25);
    }

    .lg-select {
      background: var(--lg-surface-light);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }

    .lg-select option {
      background: #141418;
      color: #ffffff;
    }

    /* Subtle Center Dot Crosshair */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.45);
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #crosshair.hidden {
      opacity: 0;
    }

    /* Collapsible Minimap (Hidden by Default) */
    #minimap-box {
      position: fixed;
      top: calc(66px + var(--safe-top));
      left: calc(14px + var(--safe-left));
      width: 150px;
      height: 150px;
      z-index: 18;
      background: var(--lg-bg);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-border);
      box-shadow: var(--lg-shadow);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #minimap-box.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px) scale(0.95);
    }

    .minimap-header {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--lg-text-muted);
      padding: 5px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #minimap-canvas {
      width: 100%;
      flex: 1;
      cursor: pointer;
    }

    /* =====================================================================
       LIQUID GLASS ACADEMIC CARD (MONOCHROME BLACK & WHITE)
       ===================================================================== */
    #academic-card {
      position: fixed;
      top: calc(66px + var(--safe-top));
      right: calc(14px + var(--safe-right));
      width: min(365px, calc(100vw - 28px));
      max-height: calc(100dvh - 160px);
      overflow-y: auto;
      z-index: 30;
      background: var(--lg-bg-deep);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-border-bright);
      box-shadow: var(--lg-shadow);
      border-radius: 24px;
      padding: 18px;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    #academic-card.collapsed {
      transform: translateX(115%);
      opacity: 0;
      pointer-events: none;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding-bottom: 10px;
    }

    .card-badge {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 800;
      color: #09090b;
      background: rgba(255, 255, 255, 0.92);
      padding: 2px 10px;
      border-radius: 99px;
      margin-bottom: 5px;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
    }

    .card-en {
      font-size: 0.72rem;
      color: var(--lg-text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .close-card-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #ffffff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .meta-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 7px 10px;
    }

    .meta-label {
      font-size: 0.64rem;
      color: var(--lg-text-muted);
      display: block;
    }

    .meta-val {
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffffff;
    }

    .card-desc {
      font-size: 0.82rem;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.88);
      margin-bottom: 12px;
      text-align: justify;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      background: var(--lg-active-bg);
      color: var(--lg-active-text);
      border: 1px solid #ffffff;
      border-radius: 999px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid var(--lg-border);
    }

    /* =====================================================================
       MINIMAL LIQUID GLASS 3D PINS
       ===================================================================== */
    #hotspots-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
      transition: opacity 0.3s ease;
    }

    #hotspots-layer.edu-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden;
    }

    .hotspot-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease, opacity 0.25s ease;
    }

    .hotspot-marker:hover {
      transform: translate(-50%, -54%) scale(1.12);
      z-index: 30;
    }

    .hotspot-pin {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(16, 16, 20, 0.58);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: all 0.2s ease;
    }

    .hotspot-marker:hover .hotspot-pin {
      background: #ffffff;
      color: #09090b;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    .hotspot-label {
      margin-top: 5px;
      background: var(--lg-bg-deep);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--lg-border);
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .hotspot-marker:hover .hotspot-label,
    body.aerial-active .hotspot-label {
      opacity: 1;
      transform: translateY(0);
    }

    /* Bottom Bar — Only visible in Aerial Overview Mode */
    .bottom-bar {
      position: fixed;
      bottom: calc(14px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      max-width: min(920px, calc(100vw - 24px));
      background: var(--lg-bg);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-border);
      box-shadow: var(--lg-shadow);
      border-radius: 999px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .bottom-bar::-webkit-scrollbar {
      display: none;
    }

    .bottom-bar.hidden-bar {
      transform: translate(-50%, 150%);
      opacity: 0;
      pointer-events: none;
    }

    .landmark-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--lg-text);
      padding: 5px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .landmark-pill.active {
      background: var(--lg-active-bg);
      color: var(--lg-active-text);
      border-color: #ffffff;
    }

    .pill-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: inherit;
      font-size: 0.68rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .landmark-pill.active .pill-num {
      background: #09090b;
      color: #ffffff;
    }

    /* Full Immersion Clean Screen Mode */
    body.clean-hud .top-capsule-wrap,
    body.clean-hud #minimap-box,
    body.clean-hud .bottom-bar,
    body.clean-hud #academic-card,
    body.clean-hud #hotspots-layer,
    body.clean-hud #mobile-controls {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #restore-hud-btn {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: calc(14px + var(--safe-left));
      z-index: 50;
      background: var(--lg-bg);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-border);
      box-shadow: var(--lg-shadow);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    body.clean-hud #restore-hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* =====================================================================
       ULTRA-SMOOTH MOBILE VIRTUAL CONTROLS (LIQUID GLASS)
       ===================================================================== */
    #mobile-controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 18;
      display: none;
    }

    body.mobile-mode #mobile-controls.walk-active {
      display: block;
    }

    /* Ergonomic Liquid Glass Analog Thumbstick */
    #joystick-zone {
      position: absolute;
      bottom: calc(26px + var(--safe-bottom));
      left: calc(22px + var(--safe-left));
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(12, 12, 16, 0.48) 100%);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      box-shadow: var(--lg-shadow);
      pointer-events: auto;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    #joystick-zone.sprinting {
      border-color: #ffffff;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.35), inset 0 0 12px rgba(255, 255, 255, 0.25);
    }

    /* Subtle directional arrows inside joystick pad */
    .joy-arrow {
      position: absolute;
      font-size: 0.55rem;
      color: rgba(255, 255, 255, 0.32);
      pointer-events: none;
    }
    .joy-arrow.up { top: 8px; left: 50%; transform: translateX(-50%); }
    .joy-arrow.down { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .joy-arrow.left { left: 8px; top: 50%; transform: translateY(-50%); }
    .joy-arrow.right { right: 8px; top: 50%; transform: translateY(-50%); }

    #joystick-knob {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #dcdce2 100%);
      border: 1px solid #ffffff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.9);
      transform: translate(0px, 0px);
      pointer-events: none;
      transition: transform 0.04s linear;
    }

    /* Right-side Mobile Action Cluster */
    #mobile-action-btns {
      position: absolute;
      bottom: calc(26px + var(--safe-bottom));
      right: calc(20px + var(--safe-right));
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    .mob-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--lg-bg);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1.5px solid var(--lg-border);
      box-shadow: var(--lg-shadow);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.18s ease;
    }

    .mob-btn:active {
      transform: scale(0.92);
    }

    .mob-btn.active {
      background: #ffffff;
      color: #09090b;
      border-color: #ffffff;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.35);
    }

    /* Compact Bottom-Center Mobile Landmark Quick-Jumper */
    #mobile-landmark-bar {
      position: absolute;
      bottom: calc(28px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      background: var(--lg-bg);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-border);
      box-shadow: var(--lg-shadow);
      border-radius: 999px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: calc(100vw - 320px);
      min-width: 185px;
      justify-content: space-between;
    }

    .mob-nav-arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .mob-nav-arrow:active {
      background: #ffffff;
      color: #09090b;
    }

    #mob-landmark-Current {
      font-size: 0.72rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 6px;
      cursor: pointer;
      text-align: center;
      flex: 1;
    }

    @media (max-width: 600px) {
      #mobile-landmark-bar {
        bottom: calc(170px + var(--safe-bottom));
        left: calc(18px + var(--safe-left));
        transform: none;
        max-width: 210px;
      }
      #academic-card {
        top: auto;
        bottom: calc(16px + var(--safe-bottom));

    applyLightingPreset('morning');

    // =========================================================================
    // 3. SOLID COLLISION ENGINE (SPATIAL WALL & SCAN GRID + BARYCENTRIC FLOOR)
    // =========================================================================
    const roofMeshes = [];
    const walkableMeshes = [];
    const wallSegmentsGrid = new Map();
    const floorTrisGrid = new Map();
    const scanOccupiedCells = new Set();
    const GRID_CELL_SIZE = 2.5;
    const PLAYER_RADIUS = 0.48;
    const PLAYER_EYE_HEIGHT = 1.70;

    function getCellKey(cx, cz) {
      return `${cx},${cz}`;
    }

    function addSegmentToGrid(ax, az, bx, bz, minY, maxY) {
      const seg = { ax, az, bx, bz, minY, maxY };
      const minX = Math.min(ax, bx) - PLAYER_RADIUS;
      const maxX = Math.max(ax, bx) + PLAYER_RADIUS;
      const minZ = Math.min(az, bz) - PLAYER_RADIUS;
      const maxZ = Math.max(az, bz) + PLAYER_RADIUS;

      const cMinX = Math.floor(minX / GRID_CELL_SIZE);
      const cMaxX = Math.floor(maxX / GRID_CELL_SIZE);
      const cMinZ = Math.floor(minZ / GRID_CELL_SIZE);
      const cMaxZ = Math.floor(maxZ / GRID_CELL_SIZE);

      for (let cx = cMinX; cx <= cMaxX; cx++) {
        for (let cz = cMinZ; cz <= cMaxZ; cz++) {
          const key = getCellKey(cx, cz);
          let bucket = wallSegmentsGrid.get(key);
          if (!bucket) {
            bucket = [];
            wallSegmentsGrid.set(key, bucket);
          }
          bucket.push(seg);
        }
      }
    }

    function insertWallTriangle(v0, v1, v2, isDenseScan) {
      const minY = Math.min(v0.y, v1.y, v2.y);
      const maxY = Math.max(v0.y, v1.y, v2.y);
      if (maxY < 1.28 || minY > 4.2) return;

      if (isDenseScan) {
        const mx = (v0.x + v1.x + v2.x) / 3;
        const mz = (v0.z + v1.z + v2.z) / 3;
        const qx = Math.round(mx / 0.20);
        const qz = Math.round(mz / 0.20);
        const qKey = `${qx},${qz}`;
        if (scanOccupiedCells.has(qKey)) return;
        scanOccupiedCells.add(qKey);
        const px = qx * 0.20;
        const pz = qz * 0.20;
        addSegmentToGrid(px - 0.08, pz, px + 0.08, pz, 0.4, 3.6);
        return;
      }

      const pairs = [[v0, v1], [v1, v2], [v2, v0]];
      for (let i = 0; i < 3; i++) {
        const a = pairs[i][0];
        const b = pairs[i][1];
        const dx = b.x - a.x;
        const dz = b.z - a.z;
        const lenSq = dx * dx + dz * dz;
        if (lenSq < 0.015) continue;
        addSegmentToGrid(a.x, a.z, b.x, b.z, minY, maxY);
      }
    }

    function insertFloorTriangle(v0, v1, v2) {
      const minY = Math.min(v0.y, v1.y, v2.y);
      const maxY = Math.max(v0.y, v1.y, v2.y);
      if (maxY < -0.5 || minY > 2.4) return;

      const minX = Math.min(v0.x, v1.x, v2.x);
      const maxX = Math.max(v0.x, v1.x, v2.x);
      const minZ = Math.min(v0.z, v1.z, v2.z);
      const maxZ = Math.max(v0.z, v1.z, v2.z);

      if (maxX - minX > 250 || maxZ - minZ > 250) return;

      const tri = {
        ax: v0.x, ay: v0.y, az: v0.z,
        bx: v1.x, by: v1.y, bz: v1.z,
        cx: v2.x, cy: v2.y, cz: v2.z
      };

      const cMinX = Math.floor(minX / GRID_CELL_SIZE);
      const cMaxX = Math.floor(maxX / GRID_CELL_SIZE);
      const cMinZ = Math.floor(minZ / GRID_CELL_SIZE);
      const cMaxZ = Math.floor(maxZ / GRID_CELL_SIZE);

      for (let cx = cMinX; cx <= cMaxX; cx++) {
        for (let cz = cMinZ; cz <= cMaxZ; cz++) {
          const key = getCellKey(cx, cz);
          let bucket = floorTrisGrid.get(key);
          if (!bucket) {
            bucket = [];
            floorTrisGrid.set(key, bucket);
          }
          bucket.push(tri);
        }
      }
    }

    function buildCollisionIndex(root) {
      const v0 = new THREE.Vector3();
      const v1 = new THREE.Vector3();
      const v2 = new THREE.Vector3();
      const e1 = new THREE.Vector3();
      const e2 = new THREE.Vector3();
      const norm = new THREE.Vector3();

      root.updateMatrixWorld(true);

      root.traverse((child) => {
        if (!child.isMesh || !child.geometry) return;
        const name = child.name || '';

        if (
          name.includes('ROOF') ||
          name.includes('roof') ||
          name.includes('سقف') ||
          name.includes('Sloped hood') ||
          name.includes('Gate shelter') ||
          name.includes('Orange ') ||
          name.includes('Shelter |') ||
          name.includes('BEAM_') ||
          name.includes('Lower concrete') ||
          name.includes('Square window') ||
          name.includes('gallery | shallow barrel')
        ) {
          roofMeshes.push(child);
        }

        if (name === 'Plane.001' || name.startsWith('WILD_FLOWER') || name.includes('Sparse dry tufts')) {
          return;
        }

        const geom = child.geometry;
        const posAttr = geom.attributes.position;
        if (!posAttr) return;
        const indexAttr = geom.index;
        const mw = child.matrixWorld;
        const triCount = indexAttr ? (indexAttr.count / 3) : (posAttr.count / 3);
        const isDenseScan = (triCount > 8000 && !name.includes('paving') && !name.includes('footprint') && !name.includes('Excavation'));

        if (!isDenseScan && (name.includes('Plane') || name.includes('paving') || name.includes('footprint') || name.includes('Floor') || name.includes('threshold'))) {
          walkableMeshes.push(child);
        }

        for (let t = 0; t < triCount; t++) {
          const i0 = indexAttr ? indexAttr.getX(t * 3 + 0) : (t * 3 + 0);
          const i1 = indexAttr ? indexAttr.getX(t * 3 + 1) : (t * 3 + 1);
          const i2 = indexAttr ? indexAttr.getX(t * 3 + 2) : (t * 3 + 2);

          v0.fromBufferAttribute(posAttr, i0).applyMatrix4(mw);
          v1.fromBufferAttribute(posAttr, i1).applyMatrix4(mw);
          v2.fromBufferAttribute(posAttr, i2).applyMatrix4(mw);

          e1.subVectors(v1, v0);
          e2.subVectors(v2, v0);
          norm.crossVectors(e1, e2).normalize();

          if (Math.abs(norm.y) < 0.55) {
            insertWallTriangle(v0, v1, v2, isDenseScan);
          } else if (norm.y > 0.55 && !isDenseScan) {
            insertFloorTriangle(v0, v1, v2);
          }
        }
      });
    }

    function resolveHorizontalCollision(pos, feetY) {
      const torsoMinY = feetY + 0.80;
      const torsoMaxY = feetY + 1.65;
      const rSq = PLAYER_RADIUS * PLAYER_RADIUS;

      for (let iter = 0; iter < 3; iter++) {
        const cx = Math.floor(pos.x / GRID_CELL_SIZE);
        const cz = Math.floor(pos.z / GRID_CELL_SIZE);
        const bucket = wallSegmentsGrid.get(getCellKey(cx, cz));
        if (!bucket) break;

        for (let i = 0; i < bucket.length; i++) {
          const seg = bucket[i];
          if (seg.maxY < torsoMinY || seg.minY > torsoMaxY) continue;

          const abx = seg.bx - seg.ax;
          const abz = seg.bz - seg.az;
          const apx = pos.x - seg.ax;
          const apz = pos.z - seg.az;
          const abLenSq = abx * abx + abz * abz;
          let t = abLenSq > 1e-6 ? ((apx * abx + apz * abz) / abLenSq) : 0;
          if (t < 0) t = 0;
          else if (t > 1) t = 1;

          const closestX = seg.ax + t * abx;
          const closestZ = seg.az + t * abz;
          const dx = pos.x - closestX;
          const dz = pos.z - closestZ;
          const distSq = dx * dx + dz * dz;

          if (distSq < rSq && distSq > 1e-8) {
            const dist = Math.sqrt(distSq);
            const overlap = PLAYER_RADIUS - dist;
            pos.x += (dx / dist) * overlap;
            pos.z += (dz / dist) * overlap;
          }
        }
      }

      pos.x = THREE.MathUtils.clamp(pos.x, -72, 70);
      pos.z = THREE.MathUtils.clamp(pos.z, -390, -148);
    }

    function sampleFloorHeight(x, z, currentFeetY) {
      const cx = Math.floor(x / GRID_CELL_SIZE);
      const cz = Math.floor(z / GRID_CELL_SIZE);
      const bucket = floorTrisGrid.get(getCellKey(cx, cz));
      if (!bucket) return null;

      let bestY = null;
      for (let i = 0; i < bucket.length; i++) {
        const t = bucket[i];
        const v0x = t.cx - t.ax;
        const v0z = t.cz - t.az;
        const v1x = t.bx - t.ax;
        const v1z = t.bz - t.az;
        const v2x = x - t.ax;
        const v2z = z - t.az;

        const dot00 = v0x * v0x + v0z * v0z;
        const dot01 = v0x * v1x + v0z * v1z;
        const dot02 = v0x * v2x + v0z * v2z;
        const dot11 = v1x * v1x + v1z * v1z;
        const dot12 = v1x * v2x + v1z * v2z;

        const denom = dot00 * dot11 - dot01 * dot01;
        if (Math.abs(denom) < 1e-8) continue;
        const invDenom = 1.0 / denom;
        const u = (dot11 * dot02 - dot01 * dot12) * invDenom;
        const v = (dot00 * dot12 - dot01 * dot02) * invDenom;

        if (u >= -0.02 && v >= -0.02 && (u + v) <= 1.02) {
          const y = t.ay + v * (t.by - t.ay) + u * (t.cy - t.ay);
          if (y <= currentFeetY + 0.88 && (bestY === null || y > bestY)) {
            bestY = y;
          }
        }
      }
      return bestY;
    }

            child.castShadow = true;

            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((mat) => {
              if (!mat) return;
              if (!allSceneMaterials.includes(mat)) allSceneMaterials.push(mat);
              if (mat.map) {
                mat.map.anisotropy = maxAniso;
                if (!mat.bumpMap && !mat.transparent) {
                  mat.bumpMap = mat.map;
                  mat.bumpScale = 0.016;

              if (mat.transparent || (mat.name && mat.name.includes('glazing'))) {
                mat.opacity = 0.26;
                mat.roughness = 0.08;
                mat.metalness = 0.1;
                mat.depthWrite = false;
              }
            });
          }
        });

        scene.add(model);

          loadingStatus.textContent = `جاري التحميل (${pct}%)...`;

    function playFootstepSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const bufferSize = audioCtx.sampleRate * 0.05;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 250 + Math.random() * 80;
        filter.Q.value = 1.8;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.055, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      } catch (e) {}
    }

      const text = `${currentLandmark.title}. الحقبة التاريخية: ${currentLandmark.era}. المادة: ${currentLandmark.material}. ${currentLandmark.desc}`;

    function tryTapFloorWalk(clientX, clientY) {
      if (currentMode !== 'walk' || walkableMeshes.length === 0) return;
      pointerNdc.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNdc.y = -(clientY / window.innerHeight) * 2 + 1;

      const hits = floorRaycaster.intersectObjects(walkableMeshes, false);
      if (hits.length > 0) {

          autoWalkTarget = hit.point.clone();

          tapRingMesh.visible = true;

    }

    renderer.domElement.addEventListener('mousedown', (e) => {

    // =========================================================================
    // ANALOG THUMBSTICK (WORKS WITH BOTH TOUCH & MOUSE DRAG!)
    // =========================================================================
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyTouchId = null;
    let joyMouseActive = false;
    const maxJoyRadius = 42;

    function updateJoystickFromClient(clientX, clientY) {
      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      const normDist = Math.min(1, dist / maxJoyRadius);

      if (dist > maxJoyRadius) {
        dx = (dx / dist) * maxJoyRadius;
        dy = (dy / dist) * maxJoyRadius;
      }
      joyKnob.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;

      // Deadzone & smooth non-linear response curve for ultra-fine slow walking + fast push
      if (normDist < 0.08) {
        joyMoveX = 0;
        joyMoveY = 0;
        joyAutoSprint = false;
      } else {
        const curved = Math.pow((normDist - 0.08) / 0.92, 1.25);
        const angle = Math.atan2(dy, dx);
        joyMoveX = Math.cos(angle) * curved;
        joyMoveY = -Math.sin(angle) * curved;
        joyAutoSprint = (normDist > 0.85 && joyMoveY > 0.55);
      }
      joyZone.classList.toggle('sprinting', joyAutoSprint || keys.sprint);
      autoWalkTarget = null;
      tapRingMesh.visible = false;
    }

    function resetJoystick() {
      joyTouchId = null;
      joyMouseActive = false;
      joyMoveX = 0;

      joyZone.classList.toggle('sprinting', keys.sprint);

    }, { passive: false });

    joyZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      e.stopPropagation();
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          updateJoystickFromClient(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
          break;
        }

    }, { passive: false });

    joyZone.addEventListener('touchend', resetJoystick);

    // =========================================================================
    // SILKY-SMOOTH MOBILE 360° TOUCH-LOOK + INERTIA + TAP-TO-WALK + PINCH ZOOM
    // =========================================================================
    let lookTouchId = null;
    let lastLookX = 0;
    let lastLookY = 0;
    let touchStartTime = 0;
    let touchStartPos = { x: 0, y: 0 };
    let initialPinchDist = null;
    let initialFov = 62;

    renderer.domElement.addEventListener('touchstart', (e) => {
      if (currentMode !== 'walk') return;

      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        initialFov = camera.fov;
        return;
      }

      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joyTouchId) continue;
        if (lookTouchId === null) {
          lookTouchId = t.identifier;
          lastLookX = t.clientX;
          lastLookY = t.clientY;
          touchStartTime = performance.now();
          touchStartPos.x = t.clientX;
          touchStartPos.y = t.clientY;

          inertiaPitch = 0;

    renderer.domElement.addEventListener('touchmove', (e) => {

        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const scale = initialPinchDist / Math.max(20, dist);
        camera.fov = THREE.MathUtils.clamp(initialFov * scale, 34, 72);
        camera.updateProjectionMatrix();
        return;
      }

      if (lookTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === lookTouchId) {
          const dx = t.clientX - lastLookX;
          const dy = t.clientY - lastLookY;
          lastLookX = t.clientX;
          lastLookY = t.clientY;
          const dYaw = -dx * 0.0042;
          const dPitch = -dy * 0.0038;
          targetYaw += dYaw;
          targetPitch = THREE.MathUtils.clamp(targetPitch + dPitch, -Math.PI * 0.42, Math.PI * 0.42);

    }, { passive: true });

          const dtTap = performance.now() - touchStartTime;
          const moveDist = Math.hypot(t.clientX - touchStartPos.x, t.clientY - touchStartPos.y);

    const mobSprintBtn = document.getElementById('mob-sprint');

    // =========================================================================
    // 8. LIVE MONOCHROME ARCHITECTURAL MINIMAP
    // =========================================================================
    const minimapCanvas = document.getElementById('minimap-canvas');
    const mCtx = minimapCanvas.getContext('2d');
    const coordsReadout = document.getElementById('coords-readout');

    function worldToMinimap(wx, wz) {
      const u = (wx - (-55)) / (50 - (-55));
      const v = (wz - (-360)) / (-235 - (-360));
      return {
        x: THREE.MathUtils.clamp(u * minimapCanvas.width, 8, minimapCanvas.width - 8),
        y: THREE.MathUtils.clamp(v * minimapCanvas.height, 8, minimapCanvas.height - 8)
      };
    }

    minimapCanvas.addEventListener('click', (e) => {
      const rect = minimapCanvas.getBoundingClientRect();
      const mx = ((e.clientX - rect.left) / rect.width) * minimapCanvas.width;
      const my = ((e.clientY - rect.top) / rect.height) * minimapCanvas.height;
      let bestLm = null;
      let bestDist = 999;
      LANDMARKS.forEach((lm) => {
        const p = worldToMinimap(lm.target.x, lm.target.z);
        const d = Math.hypot(p.x - mx, p.y - my);
        if (d < bestDist) {
          bestDist = d;
          bestLm = lm;
        }
      });
      if (bestLm && bestDist < 34) {
        focusLandmarkAcademic(bestLm);
      }
    });

    function drawMinimap() {
      if (minimapBox.classList.contains('hidden')) return;
      const w = minimapCanvas.width;
      const h = minimapCanvas.height;
      mCtx.clearRect(0, 0, w, h);

      mCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      mCtx.lineWidth = 1;
      for (let g = 25; g < w; g += 25) {
        mCtx.beginPath(); mCtx.moveTo(g, 0); mCtx.lineTo(g, h); mCtx.stroke();
        mCtx.beginPath(); mCtx.moveTo(0, g); mCtx.lineTo(w, g); mCtx.stroke();
      }

      mCtx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      mCtx.lineWidth = 1.5;
      const c1 = worldToMinimap(-32, -340);
      const c2 = worldToMinimap(34, -340);
      const c4 = worldToMinimap(-32, -250);
      mCtx.strokeRect(c1.x, c1.y, c2.x - c1.x, c4.y - c1.y);

      LANDMARKS.forEach((lm) => {
        const p = worldToMinimap(lm.target.x, lm.target.z);
        mCtx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        mCtx.beginPath();
        mCtx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        mCtx.fill();
      });

      const refPos = currentMode === 'walk' ? playerFeet : camera.position;
      const pp = worldToMinimap(refPos.x, refPos.z);

      const dirVec = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      const angle = Math.atan2(dirVec.z, dirVec.x);

      mCtx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      mCtx.beginPath();
      mCtx.moveTo(pp.x, pp.y);
      mCtx.arc(pp.x, pp.y, 22, angle - 0.45, angle + 0.45);
      mCtx.closePath();
      mCtx.fill();

      mCtx.fillStyle = '#ffffff';
      mCtx.beginPath();
      mCtx.arc(pp.x, pp.y, 4.5, 0, Math.PI * 2);
      mCtx.fill();

      coordsReadout.textContent = `${Math.round(refPos.x)}, ${Math.round(-refPos.z)}`;
    }

    // =========================================================================
    // 9. MAIN ANIMATION & ULTRA-SMOOTH PHYSICS LOOP
    // =========================================================================
    const clock = new THREE.Clock();
    const forwardVec = new THREE.Vector3();
    const rightVec = new THREE.Vector3();
    const desiredMove = new THREE.Vector3();
    const projVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      if (flyAnim) {
        flyAnim.elapsed += dt;
        const t = Math.min(1, flyAnim.elapsed / flyAnim.duration);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        camera.position.lerpVectors(flyAnim.startPos, flyAnim.endPos, ease);
        orbitControls.target.lerpVectors(flyAnim.startTarget, flyAnim.endTarget, ease);
        orbitControls.update();
        if (t >= 1) {
          const cb = flyAnim.onComplete;
          flyAnim = null;
          if (cb) cb();
        }
      } else if (currentMode === 'walk') {
        // 1. Apply swipe inertia when thumb/mouse is released
        if (lookTouchId === null && !isMouseDragging) {
          if (Math.abs(inertiaYaw) > 0.0001 || Math.abs(inertiaPitch) > 0.0001) {
            targetYaw += inertiaYaw * dt;
            targetPitch = THREE.MathUtils.clamp(targetPitch + inertiaPitch * dt, -Math.PI * 0.42, Math.PI * 0.42);
            const decay = Math.exp(-9.5 * dt);
            inertiaYaw *= decay;
            inertiaPitch *= decay;
          }
        }

        // 2. Smoothly interpolate camera orientation
        const lookSmoothing = 1 - Math.exp(-26 * dt);
        yaw = THREE.MathUtils.lerp(yaw, targetYaw, lookSmoothing);
        pitch = THREE.MathUtils.lerp(pitch, targetPitch, lookSmoothing);

        forwardVec.set(-Math.sin(yaw), 0, -Math.cos(yaw));
        rightVec.set(Math.cos(yaw), 0, -Math.sin(yaw));

        const inputZ = (keys.forward ? 1 : 0) - (keys.backward ? 1 : 0) + joyMoveY;
        const inputX = (keys.right ? 1 : 0) - (keys.left ? 1 : 0) + joyMoveX;

        desiredMove.set(0, 0, 0);

        if (Math.abs(inputZ) > 0.01 || Math.abs(inputX) > 0.01) {
          desiredMove.addScaledVector(forwardVec, inputZ);
          desiredMove.addScaledVector(rightVec, inputX);
          if (desiredMove.length() > 1) desiredMove.normalize();
        } else if (autoWalkTarget) {
          // Smooth One-Tap Floor Auto-Walk
          const toTargetX = autoWalkTarget.x - playerFeet.x;
          const toTargetZ = autoWalkTarget.z - playerFeet.z;
          const distToTarget = Math.hypot(toTargetX, toTargetZ);
          if (distToTarget < 0.35) {
            autoWalkTarget = null;
            tapRingMesh.visible = false;
          } else {
            const speedFactor = Math.min(1, distToTarget * 0.85);
            desiredMove.set((toTargetX / distToTarget) * speedFactor, 0, (toTargetZ / distToTarget) * speedFactor);
            tapRingMesh.scale.setScalar(0.9 + Math.sin(elapsed * 6) * 0.12);
          }
        }

        const isSprinting = keys.sprint || joyAutoSprint;
        const maxSpeed = isSprinting ? 7.5 : 4.3;

        // 3. Smooth velocity acceleration & damping (zero jerkiness)
        const velLerp = 1 - Math.exp(-15 * dt);
        playerVelX = THREE.MathUtils.lerp(playerVelX, desiredMove.x * maxSpeed, velLerp);
        playerVelZ = THREE.MathUtils.lerp(playerVelZ, desiredMove.z * maxSpeed, velLerp);

        const currentSpeed = Math.hypot(playerVelX, playerVelZ);
        if (currentSpeed > 0.02) {
          const subSteps = 3;
          const stepX = (playerVelX * dt) / subSteps;
          const stepZ = (playerVelZ * dt) / subSteps;
          for (let s = 0; s < subSteps; s++) {
            playerFeet.x += stepX;
            playerFeet.z += stepZ;
            resolveHorizontalCollision(playerFeet, playerFeet.y);
          }

          if (isGrounded) {
            const speedRatio = Math.min(1.4, currentSpeed / 4.3);
            walkBobTimer += dt * 8.5 * speedRatio;
            if (elapsed - lastStepTime > (isSprinting ? 0.34 : 0.48)) {
              playFootstepSound();
              lastStepTime = elapsed;
            }
          }
        } else {
          walkBobTimer = 0;
        }

        const floorY = sampleFloorHeight(playerFeet.x, playerFeet.z, playerFeet.y);
        if (!isGrounded) {
          playerVelY -= 14.5 * dt;
          playerFeet.y += playerVelY * dt;
          if (floorY !== null && playerFeet.y <= floorY) {
            playerFeet.y = floorY;
            playerVelY = 0;
            isGrounded = true;
          }
        } else if (floorY !== null) {
          playerFeet.y = THREE.MathUtils.lerp(playerFeet.y, floorY, Math.min(1, dt * 16));
        }

        const bobAmp = Math.min(1, currentSpeed / 4.0) * 0.032;
        const bobOffset = Math.sin(walkBobTimer) * bobAmp;
        camera.position.set(playerFeet.x, playerFeet.y + PLAYER_EYE_HEIGHT + bobOffset, playerFeet.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
        camera.rotation.z = 0;
      } else if (currentMode === 'aerial') {
        orbitControls.update();
      } else if (currentMode === 'tour') {
        orbitControls.autoRotate = true;
        orbitControls.autoRotateSpeed = 0.75;
        orbitControls.update();
        tourTimer += dt;
        if (tourTimer > 9.5) {
          tourTimer = 0;
          tourIndex = (tourIndex + 1) % LANDMARKS.length;
          focusLandmarkAcademic(LANDMARKS[tourIndex]);
          currentMode = 'tour';
          document.getElementById('btn-mode-aerial').classList.remove('active');
          document.getElementById('btn-mode-tour').classList.add('active');
        }
      }

      if (currentMode !== 'tour') {
        orbitControls.autoRotate = false;
      }

      // Project 3D Hotspots cleanly
      if (eduPointsOn) {
        const halfW = window.innerWidth / 2;
        const halfH = window.innerHeight / 2;
        for (let i = 0; i < hotspotElements.length; i++) {
          const item = hotspotElements[i];
          projVec.copy(item.lm.target);
          projVec.y += 1.6;
          projVec.project(camera);

          if (projVec.z > 1.0 || projVec.z < -1.0) {
            item.el.style.opacity = '0';
            item.el.style.pointerEvents = 'none';
          } else {
            const sx = (projVec.x * halfW) + halfW;
            const sy = -(projVec.y * halfH) + halfH;
            const dist = camera.position.distanceTo(item.lm.target);
            const visible = dist < 155;
            item.el.style.opacity = visible ? '1' : '0';
            item.el.style.pointerEvents = visible ? 'auto' : 'none';
            item.el.style.left = `${sx}px`;
            item.el.style.top = `${sy}px`;
          }
        }
      }

      drawMinimap();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
